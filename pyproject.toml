[project]
name = "netpulse"
version = "0.3.0"
description = "A lightweight network monitor: ping, port and DNS health checks with change-based alerts and uptime history."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdulkadir Haji" }]
dependencies = ["PyYAML>=6.0", "dnspython>=2.6", "rich>=13.0", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
