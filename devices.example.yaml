# NetPulse example config
#
# Copy this file to devices.yaml and replace the sample values with your
# own devices. devices.yaml is git-ignored, so your real IPs stay private.

settings:
  interval_seconds: 300     # how often --watch runs the checks
  history_db: netpulse.db   # SQLite uptime history
  log_file: netpulse.log
  ping_timeout_ms: 1000
  port_timeout_ms: 1000
  dns_timeout_ms: 2000

devices:
  - name: firewall
    host: 192.168.1.1
    type: pfSense
    ports: [443]            # web UI

  - name: lab-server
    host: 192.168.1.20
    type: Ubuntu server
    ports: [22, 8096]       # SSH, Jellyfin

  - name: desktop
    host: 192.168.1.50
    type: Windows PC

  - name: internet
    host: 1.1.1.1
    type: upstream

dns_checks:
  # Is the local resolver answering?
  - name: local-resolver
    server: 192.168.1.1
    query: example.com
    record_type: A

  # Drift check: fail if this record ever changes.
  - name: lab-record
    server: 192.168.1.1
    query: server.home.arpa
    record_type: A
    expect: [192.168.1.20]

  # Compare against a public resolver.
  - name: cloudflare
    server: 1.1.1.1
    query: example.com
    record_type: A
